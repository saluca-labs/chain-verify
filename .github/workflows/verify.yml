name: Verify

on:
  push:
    branches: [verify-artifact]
  pull_request:
    branches: [verify-artifact]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install cryptography
        run: python -m pip install "cryptography>=49.0.0"
      - name: Self-test (the verifier must be seen to fail)
        run: python verify_chain.py --self-test
      - name: Sample chain verifies
        run: python verify_chain.py sample-chain.jsonl --pubkey operating-key.pub
      - name: A tampered sample chain is rejected
        run: |
          sed 's/"bytes": 412/"bytes": 999999/' sample-chain.jsonl > tampered.jsonl
          if cmp -s sample-chain.jsonl tampered.jsonl; then echo "tamper step changed nothing"; exit 1; fi
          set +e
          python verify_chain.py tampered.jsonl --pubkey operating-key.pub
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "tampered chain verified"; exit 1; fi
          echo "tampered chain rejected (exit $rc)"
